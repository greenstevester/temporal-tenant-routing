apiVersion: v1
kind: Namespace
metadata:
  name: temporal-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: temporal-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
    spec:
      automountServiceAccountToken: false
      containers:
        - name: temporal
          image: temporalio/temporal:1.10.1@sha256:b228dadf9cdb6c7c02a1394b89dd76f827aac9760e458fce42f0899a10141225
          args:
            - server
            - start-dev
            - --ip
            - 0.0.0.0
            - --namespace
            - tenant-a
            - --namespace
            - tenant-b
            - --ui-disable-news-fetch
          ports:
            - containerPort: 7233
            - containerPort: 8233
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1536Mi"
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: temporal-system
spec:
  selector:
    app: temporal
  ports:
    - name: temporal
      port: 7233
    - name: browser
      port: 8233
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-demo-clients
  namespace: temporal-system
spec:
  podSelector:
    matchLabels:
      app: temporal
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [application, tenant-a, tenant-b]
      ports:
        - protocol: TCP
          port: 7233
